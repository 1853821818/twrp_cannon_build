name: Build TWRP for cannon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEVICE: cannong
  DEVICE_PATH: device/xiaomi/cannong
  TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  TWRP_BRANCH: twrp-14

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip repo
          pip3 install networkx

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Initialize TWRP manifest
        run: |
          mkdir -p ~/android/twrp
          cd ~/android/twrp
          repo init -u $TWRP_MANIFEST -b $TWRP_BRANCH
          # 关键修复：twrp-14 manifest缺少build/release仓库，导致release config为空、udc/ap3a无法识别
          # 先同步build/release补充Android 14 release配置，再同步其余
          repo sync -j$(nproc) --force-sync -c --no-tags build/release
          repo sync -j$(nproc) --force-sync -c --no-tags build/make
          repo sync -j$(nproc) --force-sync -c --no-tags
          # 确认ap3a (Android 14) release config存在
          ls build/release/release_configs/ap3a.textproto 2>&1 || echo "AP3A_MISSING" 

      - name: Copy device tree
        run: |
          cp -r $GITHUB_WORKSPACE/device ~/android/twrp/
          ls -la ~/android/twrp/device/xiaomi/cannong/

      - name: Build TWRP
        run: |
          cd ~/android/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          # Android 14的正确release是ap3a（UpsideDownCake）
          lunch twrp_cannong-ap3a-eng 2>&1 || lunch twrp_cannong-eng
          make recoveryimage -j$(nproc) 2>&1 | tail -200

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-cannon
          path: ~/android/twrp/out/target/product/cannong/recovery.img
