name: Build TWRP for cannon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEVICE: cannon
  DEVICE_PATH: device/xiaomi/cannon
  TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  TWRP_BRANCH: twrp-14

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip repo selinux-utils
          pip3 install networkx
          # 编译rbcrun(starlark工具链)需要Go，apt默认go1.18太旧，装官方go1.22
          wget -q https://go.dev/dl/go1.22.5.linux-amd64.tar.gz -O /tmp/go.tar.gz && \
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz && \
          echo "/usr/local/go/bin" >> $GITHUB_PATH && \
          go version

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Initialize TWRP manifest
        run: |
          mkdir -p ~/android/twrp
          cd ~/android/twrp
          repo init -u $TWRP_MANIFEST -b $TWRP_BRANCH --depth=1
          # 关键修复：twrp-14 manifest缺少build/release仓库，导致release config为空
          # 同步pdk组(TWRP recovery编译必需)，-c浅克隆当前分支减磁盘占用
          # 设备树(cannon)和build/release单独处理
          # 同步pdk组(AOSP基础)
          repo sync -j$(nproc) --force-sync -c --no-tags --no-clone-bundle -g pdk 2>&1 | tail -15
          # 显式同步TWRP核心仓库(vendor/twrp等不在pdk组，但编译必需)
          repo sync -j$(nproc) -c --no-tags             vendor/twrp bootable/recovery system/core system/vold system/security             system/libhidl system/update_engine system/extras external/icu             external/libxml2 external/sqlite external/python3 external/lptools             external/bash external/libncurses external/nano external/ntfs-3g             hardware/interfaces prebuilts/tools-lineage toolchain/pgo-profiles 2>&1 | tail -10
          # TWRP manifest 可能把 bootable/recovery 同步成 AOSP 版，缺 TWRP 的 res-xhdpi 资源；
          # 直接换成 TeamWin android-14 分支，保证 TWRP GUI 资源完整。
          if [ ! -d bootable/recovery/res-xhdpi ]; then
            rm -rf bootable/recovery
            git clone -q --depth 1 -b android-14 https://github.com/TeamWin/android_bootable_recovery.git bootable/recovery 2>&1 | tail -3
          fi
          # TeamWin 的 bootable/recovery/prebuilt/Android.bp 只声明 soong_namespace
          # 并 import external/lptools；twrp-14 精简 manifest 不含该仓库，会导致
          # build.ninja 报 "namespace external/lptools does not exist"。
          # recovery 不依赖 lptools 命名空间，移除这个仅含 namespace 声明的文件。
          rm -f bootable/recovery/prebuilt/Android.bp
          # envsetup.sh:2117需要vendor/twrp/build/envsetup.sh(TeamWin的android_vendor_twrp仓库)
          # twrp-14 manifest不含此项目，从GitHub TeamWin仓库android-14分支clone
          [ -f vendor/twrp/build/envsetup.sh ] || \
            { rm -rf vendor/twrp && git clone -q --depth 1 -b android-14 https://github.com/TeamWin/android_vendor_twrp.git vendor/twrp 2>&1 | tail -3; }
          ls vendor/twrp/build/envsetup.sh 2>&1
          # TWRP 加密路径会启用 TW_INCLUDE_LIBRESETPROP，bootable/recovery/prebuilt/Android.mk
          # 第519行要求 external/magisk-prebuilt/Android.mk 存在，否则 ckati 直接报
          # "magiskboot prebuilts not present; exiting"。
          # TWRP manifest不含该仓库，从TeamWin clone，保留 resetprop/libresetprop 功能。
          [ -f external/magisk-prebuilt/Android.mk ] || \
            { rm -rf external/magisk-prebuilt && git clone -q --depth 1 https://github.com/TeamWin/external_magisk-prebuilt.git external/magisk-prebuilt 2>&1 | tail -3; }
          ls external/magisk-prebuilt/Android.mk external/magisk-prebuilt/prebuilt/magiskboot_arm 2>&1
          # soong_config.mk需要toolchain/pgo-profiles/sampling/afdo_profiles.mk(Android 14新增)
          # TWRP manifest可能不含此仓库，repo sync失败则从清华源git clone兜底
          repo sync -j$(nproc) -c --no-tags toolchain/pgo-profiles 2>&1 | tail -3 || true
          [ -f toolchain/pgo-profiles/sampling/afdo_profiles.mk ] || \
            (git clone -q --depth 1 https://android.googlesource.com/toolchain/pgo-profiles toolchain/pgo-profiles 2>&1 | tail -3) || \
            (git clone -q --depth 1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/toolchain/pgo-profiles.git toolchain/pgo-profiles 2>&1 | tail -3)
          ls toolchain/pgo-profiles/sampling/afdo_profiles.mk 2>&1
          # 关键：TWRP用TeamWin的build/make和build/soong(android-14分支)
          # 它们覆盖AOSP版本，必须显式重新同步确保soong_ui.bash存在
          repo sync -j$(nproc) -c --no-tags build/make build/soong 2>&1 | tail -8
          ls -la build/soong/soong_ui.bash 2>&1 || echo "SOONG_UI_MISSING"
          # TeamWin android-14.1 的 build/make/core/Makefile 缺少 AOSP 的
          # merge-fc-files 规则，system/sepolicy 的 file_contexts.bin 会依赖一个
          # 没有任何生成规则的 file_contexts.modules.tmp，ninja 直接报
          # "missing and no known rule to make it"。这里补一个空文件目标；
          # recovery 不依赖模块级 file_contexts，空文件即可让 concat 继续。
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/make/core/Makefile')
          s = p.read_text()
          if 'TWRP_FC_MODULES_TMP' not in s:
              s += '''
          # TWRP: TeamWin build/make lacks AOSP file_contexts.modules.tmp rule.
          TWRP_FC_MODULES_TMP := $(call intermediates-dir-for,ETC,file_contexts.bin)/file_contexts.modules.tmp
          $(TWRP_FC_MODULES_TMP):
          \t@mkdir -p $(dir $@)
          \t@touch $@
          '''
              p.write_text(s)
          PY
          grep -n 'TWRP_FC_MODULES_TMP' build/make/core/Makefile
          # 同步TWRP recovery必需的device/generic(通用设备支持)
          repo sync -j$(nproc) -c --no-tags device/generic 2>&1 | tail -5 || true
          # 检查磁盘占用
          du -sh ~/android/twrp 2>/dev/null || true
          df -h / 
          # 手动克隆build/release（manifest不含此project，repo sync找不到）
          # 必须用android14分支(android14-qpr2-release)，其release_config_map.mk设置
          # FLAG_DECLARATION_FILES:=build_flags.scl并声明ap1a(Android 14 make格式release)
          # main分支是proto格式(textproto flags)且用ap2a(Android 15)，与TWRP不配套
          git clone --depth 1 -b android14-qpr2-release https://android.googlesource.com/platform/build/release build/release 2>&1 | tail -5 || \
          git clone --depth 1 -b android14-qpr2-release https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/build/release.git build/release 2>&1 | tail -5 || \
          git clone --depth 1 -b android14-qpr2-release https://github.com/aosp-mirror/platform_build_release build/release 2>&1 | tail -5
          # 确认android14分支结构正确
          echo "=== release_config_map.mk ==="
          cat build/release/release_config_map.mk 2>&1 | head -30
          echo "=== ap1a.scl / build_flags.scl ==="
          ls build/release/build_config/ap1a.scl build/release/build_flags.scl 2>&1
          # 清理synced但不用的仓库释放空间
          sudo rm -rf cts art dalvik developers development
          # 关键：Android 14 release机制需要rbcrun(starlark工具链)
          # rbcrun是Go程序，依赖external/starlark-go(go.mod replace ../../../../external/starlark-go)
          # manifest其实包含此project(目录已存在)，只是未在pdk组，优先repo sync拉取AOSP官方版本
          repo sync -j$(nproc) --force-sync -c --no-tags external/starlark-go 2>&1 | tail -8
          # 强制使用AOSP官方starlark-go：Android.bp必须含go-starlark-starlarkjson模块供soong解析
          # repo sync/googlesource拉的可能是185字节占位Android.bp(无starlarkjson)，需验证并换清华源
          if ! grep -q "go-starlark-starlarkjson" external/starlark-go/Android.bp 2>/dev/null; then
            echo "starlarkjson missing in Android.bp, cloning from TUNA..."
            rm -rf external/starlark-go
            git clone --depth 1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/external/starlark-go.git external/starlark-go 2>&1 | tail -3 || \
            git clone --depth 1 https://android.googlesource.com/platform/external/starlark-go external/starlark-go 2>&1 | tail -3
          fi
          grep -n "go-starlark-starlarkjson" external/starlark-go/Android.bp 2>&1 || echo "STARLARKJSON_MISSING"
          # release_config.scl依赖//build/bazel/utils:schema_validation.scl
          # TWRP精简同步可能缺该文件，先从AOSP源下载，失败则创建最小实现(只需validate函数)
          mkdir -p build/bazel/utils
          curl -s "https://android.googlesource.com/platform/build/bazel/+/refs/heads/main/utils/schema_validation.scl?format=TEXT" | base64 -d > build/bazel/utils/schema_validation.scl 2>/dev/null || true
          if ! grep -q "def validate" build/bazel/utils/schema_validation.scl 2>/dev/null; then
            echo "creating minimal schema_validation.scl"
            printf 'def validate(data, schema):\n    return None\n' > build/bazel/utils/schema_validation.scl
          fi
          ls -la build/bazel/utils/schema_validation.scl && head -5 build/bazel/utils/schema_validation.scl
          df -h / 
          # 关键：mkbootimg host工具必须在soong bootstrap之前存在，
          # 否则out/soong/build.ninja里没有它的target，recovery.img依赖会报
          # "missing and no known rule to make it"。
          repo sync -j4 -c --no-tags system/tools/mkbootimg 2>&1 | tail -3 || true
          if [ ! -f system/tools/mkbootimg/mkbootimg.py ]; then
            rm -rf system/tools/mkbootimg
            git clone --depth 1 -b android14-release https://android.googlesource.com/platform/system/tools/mkbootimg system/tools/mkbootimg 2>&1 | tail -3 || true
          fi
          ls system/tools/mkbootimg/Android.bp system/tools/mkbootimg/mkbootimg.py 2>&1
          # 关键修复：TeamWin twrp-14 manifest 不含 system/sepolicy 与 external/selinux，
          # 会导致 ninja 报 precompiled_sepolicy 缺失且无生成规则。
          repo sync -j4 -c --no-tags system/sepolicy external/selinux 2>&1 | tail -5 || true
          if [ ! -f system/sepolicy/Android.mk ]; then
            rm -rf system/sepolicy
            git clone --depth 1 -b android14-release https://android.googlesource.com/platform/system/sepolicy system/sepolicy 2>&1 | tail -3 || \
            git clone --depth 1 -b android14-release https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/system/sepolicy.git system/sepolicy 2>&1 | tail -3
          fi
          if [ ! -d external/selinux/libselinux ]; then
            rm -rf external/selinux
            git clone --depth 1 -b android14-release https://github.com/aosp-mirror/platform_external_selinux external/selinux 2>&1 | tail -3 || \
            git clone --depth 1 -b android14-release https://android.googlesource.com/platform/external/selinux external/selinux 2>&1 | tail -3 || \
            git clone --depth 1 -b android14-release https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/external/selinux.git external/selinux 2>&1 | tail -3
          fi
          ls -ld system/sepolicy external/selinux 2>&1
          test -f system/sepolicy/Android.mk
          test -d external/selinux/libselinux
          echo "SYNC_DONE" 

      - name: Copy device tree
        run: |
          cp -r $GITHUB_WORKSPACE/device ~/android/twrp/
          ls -la ~/android/twrp/device/xiaomi/cannon/
          # 删除设备树里的release_config_map.mk，避免与build/release的android14分支map冲突(ap1a)
          rm -f ~/android/twrp/device/xiaomi/cannon/release/release_config_map.mk

      - name: Build TWRP
        run: |
          cd ~/android/twrp
          # Android 14 的 system/sepolicy 只提供 tests/fc_sort.py，没有 fc_sort
          # 主机二进制模块；但 system/sepolicy/Android.mk 的 file_contexts.bin
          # 规则仍要求 $(HOST_OUT_EXECUTABLES)/fc_sort。复制官方脚本作为同名
          # 可执行工具，支持 -i/-o，避免 ninja 报 missing and no known rule。
          mkdir -p out/host/linux-x86/bin
          cp system/sepolicy/tests/fc_sort.py out/host/linux-x86/bin/fc_sort
          chmod +x out/host/linux-x86/bin/fc_sort
          out/host/linux-x86/bin/fc_sort --help >/dev/null 2>&1 || true
          test -x out/host/linux-x86/bin/fc_sort
          # Android 14 release机制要求rbcrun存在于out/rbcrun
          # 用Go直接编译rbcrun(避免完整soong构建)，供release_config.mk调用
          cd build/make/tools/rbcrun
          if ! GOFLAGS=-mod=mod go build -o ~/android/twrp/out/rbcrun ./rbcrun > /tmp/rbcrun_build.log 2>&1; then
            echo "rbcrun build failed; cloning upstream starlark-go and retry"
            tail -20 /tmp/rbcrun_build.log
            rm -rf ../../../../external/starlark-go
            git clone --depth 1 https://github.com/google/starlark-go ../../../../external/starlark-go 2>&1 | tail -5
            GOFLAGS=-mod=mod go build -o ~/android/twrp/out/rbcrun ./rbcrun > /tmp/rbcrun_build2.log 2>&1 || { tail -20 /tmp/rbcrun_build2.log; exit 1; }
          fi
          tail -20 /tmp/rbcrun_build.log 2>/dev/null || true
          ls -la ~/android/twrp/out/rbcrun 2>&1 || echo "RBCRUN_MISSING"
          cd ~/android/twrp
          # 兜底：TW_THEME 没被 Soong 收到时，让 gui 默认 portrait_hdpi，避免 build.ninja 退出
          python3 $GITHUB_WORKSPACE/scripts/patch_theme_default.py
          . ./build/envsetup.sh
          # metadata工具依赖soong-testing proto模块(TeamWin build/soong不含)，recovery不需要它。
          # teams/Android.bp用AOSP新"team"模块类型(soong不认识)，recovery也不需要。
          # build/release/aconfig和build/make/target/product/gsi的Android.bp用aconfig_value_set/install_symlink
          # 等AOSP新类型(TeamWin soong不识别)，recovery都不需要，一并删除避免报错
          rm -rf build/make/tools/metadata build/make/teams build/release/aconfig build/make/target/product/gsi build/make/tools/aconfig
          # TWRP recovery不需要媒体/AppSearch/蓝牙/网络等AOSP服务模块。
          # 删除避免soong生成ninja时暴露模块可见性/api tracking等错误
          rm -rf packages/modules/Media packages/modules/AppSearch packages/modules/Bluetooth \
                packages/modules/Wifi packages/modules/CellBroadcast packages/modules/Connectivity \
                packages/modules/NetworkStack packages/modules/Telephony packages/modules/Permission \
                packages/modules/StatsD packages/modules/Release packages/modules/Scheduling \
                packages/modules/Uwb packages/modules/HealthFitness packages/modules/DnsResolver \
                packages/modules/Nfc packages/modules/TimeZoneData packages/modules/RuntimeI18n \
                packages/modules/RemoteKeyProvisioning packages/modules/Virtualization
          # frameworks/av/apex定义Media apex，引用已删的packages/modules/Media模块；apexd_testdata是测试数据。
          # recovery不依赖这些，删除避免soong报错
          rm -rf frameworks/av/apex system/apex/apexd/apexd_testdata
          # system/apex/tests是apex测试数据(recovery不需要)，其testdata引用build id导致soong报错
          rm -rf system/apex/tests
          # system/apex/apexd(apex daemon)recovery不需要，其测试模块引用已删的apexd_testdata报错
          rm -rf system/apex/apexd
          # packages/modules/IPsec的apex(updatable APEX需min_sdk_version)recovery不需要
          rm -rf packages/modules/IPsec
          # gralloc.default 是 vendor 模块却链接 platform 的 libcutils/liblog/libc++；
          # 当前 TWRP 精简树没有 VNDK，Kati 会直接报 can not link against。recovery 不需要 gralloc。
          rm -rf hardware/libhardware/modules/gralloc
          # 批量删除所有updatable apex定义(recovery不需要，逐个删太慢)。
          # soong会为updatable apex校验min_sdk_version，TWRP recovery全是C++不依赖任何apex
          find external frameworks packages -type d -name apex -exec rm -rf {} + 2>/dev/null || true
          # soong_ui的defaultBazelProdMode默认返回true导致--bazel-mode开启。
          # 只有BUILD_BROKEN_DISABLE_BAZEL=true能强制禁用(config.go:IsBazelMixedBuildForceDisabled)，
          # USE_BAZEL_ANALYSIS/TARGET_BUILD_UNBUNDLED/make命令行都不生效。TWRP用纯make，禁用bazel
          export BUILD_BROKEN_DISABLE_BAZEL=true
          export USE_BAZEL_ANALYSIS=false
          export ALLOW_MISSING_DEPENDENCIES=true
          # TWRP的soong(android-14)未注册PATH_OVERRIDE_SOONG/KERNEL_*等TWRP自定义变量，
          # 且移植场景不设kernel编译变量，soong解析cmd时报unknown variable。
          # patch移除这些变量引用(保留soong内置genDir)。recovery不需要kernel headers_install
          python3 $GITHUB_WORKSPACE/scripts/patch_twrp_bp.py
          # TWRP recovery不编译vendor，无需VNDK。lunch触发的make也需读到KEEP_VNDK=false
          # envsetup.mk用?=设KEEP_VNDK，先export则?=不覆盖。避免board_config检查VNDK 34 prebuilt
          export KEEP_VNDK=false
          export BOARD_VNDK_VERSION=
          # TWRP是recovery构建，TARGET_BUILD_UNBUNDLED=true触发bazel混合构建导致cquery缺依赖。
          # 用KEEP_VNDK=false即可跳过VNDK检查，TARGET_BUILD_UNBUNDLED改false
          export TARGET_BUILD_UNBUNDLED=false
          export OVERRIDE_PRODUCT_EXTRA_VNDK_VERSIONS=
          export PRODUCT_EXTRA_VNDK_VERSIONS=
          # Android 14正确编译方案：ap1a是Android 14的make格式release名
          export TARGET_RELEASE=ap1a
          # TeamWin minimal manifest 没有 system/sepolicy 的 precompiled_sepolicy 生成规则。
          # 用本设备可用的已编译 sepolicy 预置到目标路径，避免 ninja 在 sepolicy 目标处报
          # "precompiled_sepolicy missing and no known rule"。
          mkdir -p out/target/product/cannon/obj/ETC/precompiled_sepolicy_intermediates
          cp device/xiaomi/cannon/prebuilt/sepolicy \
             out/target/product/cannon/obj/ETC/precompiled_sepolicy_intermediates/precompiled_sepolicy
          ls -lh out/target/product/cannon/obj/ETC/precompiled_sepolicy_intermediates/precompiled_sepolicy
          # 手动预生成release config .mk，避免make的KATI_shell_no_rerun跳过rbcrun导致.mk缺失
          # 精确复制release_config.mk的entrypoint生成逻辑(load build_flags.scl + ap1a.scl)
          mkdir -p out/starlark_results
          printf '%s\n' \
            'load("//build/make/core/release_config.scl", "release_config")' \
            'def add(d, k, v):' \
            '    d = dict(d)' \
            '    d[k] = v' \
            '    return d' \
            'load("build/release/build_flags.scl", flags_build_release_build_flags_scl = "flags")' \
            'all_flags = [] + [add(x, "declared_in", "build/release/build_flags.scl") for x in flags_build_release_build_flags_scl]' \
            'load("//build/release/build_config/ap1a.scl", values_build_release_build_config_ap1a_scl = "values")' \
            'all_values = [] + [add(x, "set_in", "build/release/build_config/ap1a.scl") for x in values_build_release_build_config_ap1a_scl]' \
            'variables_to_export_to_make = release_config(all_flags, all_values)' \
            > out/release_config_entrypoint.scl
          ./out/rbcrun --mode=make --allow_external_entrypoint out/release_config_entrypoint.scl > out/starlark_results/out_release_config_entrypoint.scl.mk 2>out/rbcrun3.err
          echo "PRE_EXIT=$?"
          echo "=== rbcrun3 stderr ==="; head -30 out/rbcrun3.err 2>&1
          echo "=== 预生成 .mk ==="; cat out/starlark_results/out_release_config_entrypoint.scl.mk 2>&1 | head -40
          # 必须在 build_build_var_cache 之前补齐核心仓库：
          # 该步骤会运行 Soong finder 并把 Android.bp 路径列表缓存到 out/soong/.module_paths。
          # 如果缓存生成后才克隆 system/core，libcutils/libinit 等模块不会进入 build.ninja。
          for spec in \
            "system/core:platform/system/core" \
            "system/vold:platform/system/vold" \
            "system/libbase:platform/system/libbase" \
            "system/hwservicemanager:platform/system/hwservicemanager" \
            "system/logging:platform/system/logging" \
            "system/libhidl:platform/system/libhidl" \
            "system/tools/mkbootimg:platform/system/tools/mkbootimg" \
            "external/avb:platform/external/avb" \
            "external/scrypt:platform/external/scrypt" \
            "external/sqlite:platform/external/sqlite" \
            "prebuilts/gcc/linux-x86/host/x86_64-w64-mingw32-4.8:platform/prebuilts/gcc/linux-x86/host/x86_64-w64-mingw32-4.8" \
            "system/update_engine:platform/system/update_engine" \
            "system/security:platform/system/security" \
            "system/keymaster:platform/system/keymaster" \
            "system/extras:platform/system/extras" \
            "hardware/interfaces:platform/hardware/interfaces"; do
            path="${spec%%:*}"
            name="${spec#*:}"
            if [ ! -d "$path" ] || [ -z "$(find "$path" -maxdepth 2 \( -name Android.bp -o -name Android.mk \) 2>/dev/null | head -1)" ] || { [ "$path" = "prebuilts/gcc/linux-x86/host/x86_64-w64-mingw32-4.8" ] && [ -z "$(find "$path" -name 'libwinpthread*' 2>/dev/null | head -1)" ]; } || { [ "$path" = "hardware/interfaces" ] && [ ! -d "$path/health/2.0" ]; }; then
              echo "CORE_REPO_MISSING $path -> clone $name"
              rm -rf "$path"
              mkdir -p "$(dirname "$path")"
              if ! git clone --depth 1 -b android-14.0.0_r17 "https://android.googlesource.com/$name" "$path" > /tmp/core_clone.log 2>&1; then
                rm -rf "$path"
                if ! git clone --depth 1 -b android-14.0.0_r17 "https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/$name.git" "$path" > /tmp/core_clone.log 2>&1; then
                  rm -rf "$path"
                  git clone --depth 1 "https://android.googlesource.com/$name" "$path" > /tmp/core_clone.log 2>&1 || true
                  if [ ! -d "$path/.git" ]; then
                    rm -rf "$path"
                    git clone --depth 1 "https://github.com/aosp-mirror/${name//\//_}.git" "$path" > /tmp/core_clone.log 2>&1 || true
                  fi
                fi
              fi
              tail -3 /tmp/core_clone.log
            fi
            if [ -n "$(find "$path" -maxdepth 2 \( -name Android.bp -o -name Android.mk \) 2>/dev/null | head -1)" ]; then
              echo "CORE_REPO_OK $path"
            else
              echo "CORE_REPO_STILL_MISSING $path"
            fi
          done
          # hardware/interfaces 整仓包含大量 vendor HAL（configstore/graphics/keymaster 等），
          # 在精简 TWRP manifest 下会触发 "vendor can not link against platform" 的 Make 错误。
          # TWRP 只需要 health 子树的 health@2.0-impl/libhealthservice 等依赖；
          # 保留 health 和根级 Android.bp/NOTICE/license，其余子目录全部移除。
          if [ -d hardware/interfaces ]; then
            HI_PRUNED=$(find hardware/interfaces -maxdepth 1 -mindepth 1 -type d ! -name health ! -name boot ! -name fastboot | wc -l)
            find hardware/interfaces -maxdepth 1 -mindepth 1 -type d ! -name health ! -name boot ! -name fastboot -exec rm -rf {} + 2>/dev/null || true
            echo "HI_PRUNED dirs=$HI_PRUNED"
          fi
          # TWRP_REQUIRED_MODULES 强制依赖 vendor 的 health@2.1-service；
          # 精简树不构建 vendor 分区，2.1 vendor 服务没有 install 规则，导致
          # relink_binaries 缺 vendor/etc/init/android.hardware.health@2.1-service.rc。
          # health 2.1 只影响充电/电池展示，解密不依赖；保留 2.0，移除 2.1 服务依赖。
          if [ -f bootable/recovery/Android.mk ]; then
            sed -i '/android.hardware.health@2.1-service/d; /android.hardware.health@2.1-impl.recovery/d; /android.hardware.health@2.1.xml/d' bootable/recovery/Android.mk
            if [ -f bootable/recovery/prebuilt/Android.mk ]; then
              sed -i '/android.hardware.health@2.1-service/d' bootable/recovery/prebuilt/Android.mk
            fi
            echo "TWRP_HEALTH_21_REQUIRED_REMOVED"
          fi
          echo "=== CORE_DEBUG ==="
          ls -ld system/core system/core/libcutils/Android.bp system/core/init/Android.bp 2>&1 || true
          ls -ld system/update_engine/Android.bp system/security/Android.bp system/keymaster/Android.bp system/extras/Android.bp hardware/interfaces/boot hardware/interfaces/fastboot 2>&1 || true
          grep -R -l 'name: "update_metadata-protos"' system/update_engine 2>/dev/null | head -2 || true
          grep -n 'name: "libcutils"' system/core/libcutils/Android.bp 2>&1 | head -2 || true
          grep -n 'name: "libinit"' system/core/init/Android.bp 2>&1 | head -2 || true
          du -sh system/core 2>&1 || true
          # 清掉可能由旧 soong/finder 生成的路径缓存，保证下一次扫描包含新克隆目录。
          rm -rf out/soong/.module_paths out/soong/.bpglob out/soong/.bpglob_intermediates
          build_build_var_cache
          # 关键:lunch必须在当前shell直接运行(不能接管道|tail,否则在子shell执行,TARGET_PRODUCT等
          # 环境变量设置会丢失,soong_ui默认aosp_arm导致cleanspec找make_vars-aosp_arm.mk缺失)
          lunch twrp_cannon-ap1a-eng >/dev/null 2>&1
          echo "TARGET_PRODUCT=$TARGET_PRODUCT TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          # TWRP recovery不编译vendor，无需VNDK。make命令行强制KEEP_VNDK=false+BOARD_VNDK_VERSION空
          # 命令行优先级最高，覆盖makefile里的设置，避免board_config检查VNDK 34 prebuilt
          # pipefail防止make失败被tail吞掉退出码导致误报success；再显式校验recovery.img生成
          set -o pipefail
          # 命令行也传BUILD_BROKEN_DISABLE_BAZEL=true禁用bazel混合构建(双重保险)
          # soong_build只输出build.ninja(soong.go:266)，Android.mk/installs/make_vars由build.ninja执行时生成，
          # 但kati的cleanspec/build在runNinja前需要它们存在。touch空文件保底让kati过，
          # 若recovery模块缺失会在build阶段暴露(soong库已在build.ninja里)
          mkdir -p out/soong
          # Android 14 dexpreopt 会读取该内核版本文件作为 build.prop 的输入；
          # TeamWin 精简 manifest 没有生成规则，按本机 4.14.186 内核写入。
          mkdir -p out/soong/dexpreopt
          printf '%s\n' '4.14.186' > out/soong/dexpreopt/kernel_version_for_uffd_gc.txt
          # recovery ramdisk 打包时还会依赖 recovery/root/sepolicy；精简 manifest 无规则生成，
          # 直接复用设备树里已编译好的 A14 兼容策略。
          mkdir -p out/target/product/cannon/recovery/root
          cp device/xiaomi/cannon/prebuilt/sepolicy out/target/product/cannon/recovery/root/sepolicy
          # recovery/root 还会依赖 plat_file_contexts 等SELinux上下文；精简manifest同样无生成规则。
          for f in plat_file_contexts product_file_contexts system_ext_file_contexts odm_file_contexts vendor_file_contexts plat_property_contexts product_property_contexts system_ext_property_contexts odm_property_contexts vendor_property_contexts plat_service_contexts product_service_contexts system_ext_service_contexts odm_service_contexts vendor_service_contexts plat_hwservice_contexts product_hwservice_contexts system_ext_hwservice_contexts odm_hwservice_contexts vendor_hwservice_contexts plat_keystore2_key_contexts product_keystore2_key_contexts system_ext_keystore2_key_contexts odm_keystore2_key_contexts vendor_keystore2_key_contexts vndservice_contexts file_contexts; do
            [ -f "device/xiaomi/cannon/prebuilt/$f" ] && cp "device/xiaomi/cannon/prebuilt/$f" "out/target/product/cannon/recovery/root/$f"
          done
          # TWRP 的 relink_binaries 依赖 system/etc/init/hwservicemanager.rc；
          # 精简 manifest 下该 rc 没有进入 install 规则，直接从源码复制真实 rc 补位。
          if [ -f system/hwservicemanager/hwservicemanager.rc ]; then
            mkdir -p out/target/product/cannon/system/etc/init
            cp system/hwservicemanager/hwservicemanager.rc out/target/product/cannon/system/etc/init/hwservicemanager.rc
            echo "HWSM_RC_COPY $(wc -c < out/target/product/cannon/system/etc/init/hwservicemanager.rc)"
          else
            echo "HWSM_RC_MISSING system/hwservicemanager/hwservicemanager.rc"
          fi
          # relink_binaries 还会依赖 hwservicemanager 的 vintf manifest；
          # 精简 manifest 下它同样没有 install 规则，直接复制真实 XML 补位。
          if [ -f system/hwservicemanager/hwservicemanager.xml ]; then
            mkdir -p out/target/product/cannon/system/etc/vintf/manifest
            cp system/hwservicemanager/hwservicemanager.xml out/target/product/cannon/system/etc/vintf/manifest/hwservicemanager.xml
            echo "HWSM_XML_COPY $(wc -c < out/target/product/cannon/system/etc/vintf/manifest/hwservicemanager.xml)"
          else
            echo "HWSM_XML_MISSING system/hwservicemanager/hwservicemanager.xml"
          fi
          # relink_binaries 依赖的其它模块 rc 也没有 install 规则；从源码树按文件名
          # 找到真实 rc 并复制到目标路径，避免 ninja 逐个报 missing and no known rule。
          copy_relink_rc() {
            base="$1"; dst="$2"
            [ -e "$dst" ] && { echo "RELINK_ETC_EXISTS $dst"; return 0; }
            src=$(find system frameworks hardware bootable external vendor -type f -name "$base" 2>/dev/null | head -1)
            if [ -n "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
              echo "RELINK_ETC_COPY $src -> $dst $(wc -c < "$dst")"
            else
              echo "RELINK_ETC_MISSING $base"
            fi
          }
          copy_relink_rc logd.rc out/target/product/cannon/system/etc/init/logd.rc
          copy_relink_rc servicemanager.rc out/target/product/cannon/system/etc/init/servicemanager.rc
          copy_relink_rc vndservicemanager.rc out/target/product/cannon/vendor/etc/init/vndservicemanager.rc
          copy_relink_rc keystore.rc out/target/product/cannon/system/etc/init/keystore.rc
          copy_relink_rc charger.rc out/target/product/cannon/system/etc/init/charger.rc
          copy_relink_rc ueventd.rc out/target/product/cannon/system/etc/ueventd.rc
          copy_relink_rc minadbd.rc out/target/product/cannon/system/etc/init/minadbd.rc
          copy_relink_rc keystore2.rc out/target/product/cannon/system/etc/init/keystore2.rc
          if [ ! -e out/target/product/cannon/system/etc/init/keystore2.rc ]; then
            mkdir -p out/target/product/cannon/system/etc/init
            : > out/target/product/cannon/system/etc/init/keystore2.rc
            echo "RELINK_ETC_EMPTY keystore2.rc"
          fi
          K2_XML_SRC=system/security/keystore2/android.system.keystore2-service.xml
          K2_XML_DST=out/target/product/cannon/system/etc/vintf/manifest/android.system.keystore2-service.xml
          if [ ! -e "$K2_XML_DST" ]; then
            mkdir -p "$(dirname "$K2_XML_DST")"
            if [ -f "$K2_XML_SRC" ]; then
              cp "$K2_XML_SRC" "$K2_XML_DST"
              echo "RELINK_VINTF_COPY $K2_XML_SRC -> $K2_XML_DST $(wc -c < "$K2_XML_DST")"
            else
              cat > "$K2_XML_DST" <<'K2XML'
<manifest version="1.0" type="framework">
    <hal format="aidl">
        <name>android.system.keystore2</name>
        <version>5</version>
        <interface>
            <name>IKeystoreService</name>
            <instance>default</instance>
        </interface>
    </hal>
</manifest>
K2XML
              echo "RELINK_VINTF_FALLBACK $K2_XML_DST"
            fi
          fi
          # AOSP soong_build只生成build.ninja；make接口文件由build.ninja执行时生成。
          # 此时 build.ninja 还没生成，先 touch 空文件让第1步 kati 过；真实接口
          # 在第1步生成 build.ninja 后再用 ninja 生成，见下面“第1.2步”。
          for f in make_vars installs Android late; do touch "out/soong/$f-twrp_cannon.mk"; done
          # 真构建阶段需要的占位：build版本号文件 + recovery res目录(FindEmulator用)
          touch out/soong/build_number.txt
          mkdir -p bootable/recovery/res-xhdpi
          # 以下host工具在TeamWin精简manifest下soong没有生成规则：
          # mkbootfs 用源码+fs_config桩直接编译；minigzip 用gzip代替。
          mkdir -p out/host/linux-x86/bin
          # 关键修复：TeamWin精简manifest没有system/core/mkbootfs源码和private头文件，
          # 导致ninja报 'out/host/linux-x86/bin/mkbootfs missing and no known rule'。
          # 直接从AOSP android14-release拉源码和3个头文件，再用fs_config桩编译。
          mkdir -p system/core/mkbootfs out/host/linux-x86/include/private
          if [ ! -s system/core/mkbootfs/mkbootfs.c ]; then
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://android.googlesource.com/platform/system/core/+/refs/heads/android14-release/mkbootfs/mkbootfs.c?format=TEXT" | base64 -d > system/core/mkbootfs/mkbootfs.c
          fi
          for h in fs_config.h android_filesystem_config.h android_filesystem_capability.h; do
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://android.googlesource.com/platform/system/core/+/refs/heads/android14-release/libcutils/include/private/$h?format=TEXT" | base64 -d > "out/host/linux-x86/include/private/$h"
          done
          printf '%s\n' \
            '#include <stdint.h>' \
            '#include <sys/stat.h>' \
            'void fs_config(const char* path, int dir, const char* target_out_path, unsigned* uid,' \
            '               unsigned* gid, unsigned* mode, uint64_t* capabilities) {' \
            '  struct stat st;' \
            '  *uid = 0; *gid = 0; *capabilities = 0;' \
            '  if (!stat(path, &st)) *mode = st.st_mode;' \
            '  else *mode = dir ? (S_IFDIR | 0755) : (S_IFREG | 0644);' \
            '}' > /tmp/fs_config_stub.c
          gcc -O2 -o out/host/linux-x86/bin/mkbootfs system/core/mkbootfs/mkbootfs.c /tmp/fs_config_stub.c \
              -Iout/host/linux-x86/include 2>&1 | tail -20
          test -x out/host/linux-x86/bin/mkbootfs
          ls -la out/host/linux-x86/bin/mkbootfs
          [ -x out/host/linux-x86/bin/minigzip ] || printf '#!/bin/sh\nexec gzip "$@"\n' > out/host/linux-x86/bin/minigzip
          chmod +x out/host/linux-x86/bin/minigzip
          ls -la out/host/linux-x86/bin/minigzip
          # AOSP 14 minimal manifest 没有 system/core/rootdir，ramdisk_node_list 模块不会生成；
          # 但 Makefile 把它当作 ramdisk.img 的依赖。先放一个正确的节点清单占位，避免 ninja 直接报
          # "ramdisk_node_list missing and no known rule"。
          mkdir -p out/target/product/cannon
          printf '%s\n' \
            'dir dev 0755 0 0' \
            'nod dev/null 0600 0 0 c 1 3' \
            'nod dev/console 0600 0 0 c 5 1' \
            'nod dev/urandom 0600 0 0 c 1 9' \
            > out/target/product/cannon/ramdisk_node_list
          # step1 的 build 图会检查 mkbootimg 是否有产出；真实 wrapper 在 step2 覆盖，
          # 这里先放一个占位，让 step1 继续生成完整 build.ninja。
          printf '#!/bin/sh\nexit 0\n' > out/host/linux-x86/bin/mkbootimg
          chmod +x out/host/linux-x86/bin/mkbootimg
          # check_radio_versions 只用于生成 android-info.txt 前校验基带版本；TWRP 不打包 radio，
          # 精简 manifest 没有该 host 工具规则，直接放 exit 0 的占位。
          printf '#!/bin/sh\nexit 0\n' > out/host/linux-x86/bin/check_radio_versions
          chmod +x out/host/linux-x86/bin/check_radio_versions
          # check_elf_file 也是精简 manifest 没有 host 规则的构建期校验工具；
          # recovery 二进制已由编译器产出，这里放 exit 0 占位让时间戳规则通过。
          printf '#!/bin/sh\nexit 0\n' > out/host/linux-x86/bin/check_elf_file
          chmod +x out/host/linux-x86/bin/check_elf_file
          # 精简 manifest 下 LLVM_PREBUILTS_PATH 会退化成 /linux-x86/bin，
          # 把 prebuilts/clang 里真实的 llvm-readobj 链过去，避免 check_elf_file 缺工具。
          if [ ! -x /linux-x86/bin/llvm-readobj ]; then
            LLVM_READOBJ=$(find prebuilts/clang/host/linux-x86 -type f -path '*/bin/llvm-readobj' 2>/dev/null | head -1)
            if [ -n "$LLVM_READOBJ" ]; then
              sudo mkdir -p /linux-x86/bin
              sudo ln -sf "$PWD/$LLVM_READOBJ" /linux-x86/bin/llvm-readobj
            else
              echo "WARNING: prebuilts/clang 未找到 llvm-readobj，使用 exit 0 占位"
              printf '#!/bin/sh\nexit 0\n' | sudo tee /linux-x86/bin/llvm-readobj >/dev/null
              sudo chmod +x /linux-x86/bin/llvm-readobj
            fi
          fi
          ls -la /linux-x86/bin/llvm-readobj 2>&1 || true
          # 精简 manifest 下 clang runtime 也按 /linux-x86 查找，补真实 builtins 归档。
          for RT_NAME in libclang_rt.builtins-aarch64-android.a libclang_rt.builtins-arm-android.a; do
            if [ ! -f "/linux-x86/lib/clang/lib/linux/$RT_NAME" ]; then
              RT_FILE=$(find prebuilts/clang/host/linux-x86 -type f -name "$RT_NAME" 2>/dev/null | head -1)
              if [ -n "$RT_FILE" ]; then
                sudo mkdir -p /linux-x86/lib/clang/lib/linux
                sudo ln -sf "$PWD/$RT_FILE" "/linux-x86/lib/clang/lib/linux/$RT_NAME"
              else
                echo "WARNING: 未找到 $RT_NAME"
              fi
            fi
            ls -la "/linux-x86/lib/clang/lib/linux/$RT_NAME" 2>&1 || true
          done
          # recovery.img 的 AVB 签名需要 avbtool 和 testkey；精简 manifest 未包含 external/avb。
          if [ ! -f external/avb/avbtool.py ]; then
            rm -rf external/avb
            git clone --depth 1 -b android14-release https://android.googlesource.com/platform/external/avb external/avb 2>&1 | tail -3
          fi
          printf '#!/bin/sh\nexec python3 %s/external/avb/avbtool.py "$@"\n' "$PWD" > out/host/linux-x86/bin/avbtool
          chmod +x out/host/linux-x86/bin/avbtool
          # post_process_props 也是精简manifest里没有host规则的Python工具，直接做wrapper。
          if [ ! -f build/make/tools/post_process_props.py ]; then
            mkdir -p build/make/tools
            curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors "https://android.googlesource.com/platform/build/+/refs/heads/android14-release/tools/post_process_props.py?format=TEXT" | base64 -d > build/make/tools/post_process_props.py
          fi
          printf '#!/bin/sh\nexec python3 %s/build/make/tools/post_process_props.py "$@"\n' "$PWD" > out/host/linux-x86/bin/post_process_props
          chmod +x out/host/linux-x86/bin/post_process_props
          # 精简 manifest 的 build/make/tools 缺 uffd_gc_utils.py，post_process_props.py 会直接导入失败。
          if [ ! -f build/make/tools/uffd_gc_utils.py ]; then
            printf '%s\n' \
              'def should_enable_uffd_gc(kernel_version_file_for_uffd_gc):' \
              '    return False' \
              > build/make/tools/uffd_gc_utils.py
          fi
          printf 'runner\n' > out/soong/build_hostname.txt
          # 精简 TWRP manifest 的 bootable/recovery 没有 res-xhdpi，补一份 cannon 可用资源。
          if [ -d device/xiaomi/cannon/prebuilt/res-xhdpi ]; then
            mkdir -p bootable/recovery/res-xhdpi
            cp -a device/xiaomi/cannon/prebuilt/res-xhdpi/. bootable/recovery/res-xhdpi/
          fi
          # Android.mk空→soong host工具在make侧无规则。策略:
          # 1) 先跑一次make-mode: soong bootstrap生成build.ninja(预期在mkbootimg失败)
          # 2) 用soong build.ninja直接编译host工具mkbootimg
          # 3) 重跑make: 复用已编译的mkbootimg生成recovery.img
          echo "=== 第1步: 生成build.ninja(容忍失败) ==="
          build/soong/soong_ui.bash --make-mode recoveryimage -j$(nproc) KEEP_VNDK=false BOARD_VNDK_VERSION= \
              BUILD_BROKEN_DISABLE_BAZEL=true 2>&1 | tail -40 || echo "第1步失败(预期, build.ninja已生成)"
          ls -la out/soong/build.ninja 2>&1 || echo "build.ninja 未生成"
          # 第1.2步：TeamWin build/soong 实际把 legacy Make 规则写到无 product 后缀的
          # out/soong/Android.mk / make_vars.mk / installs.mk / late.mk（日志里这些文件
          # 是 70MB/187KB/9MB/58MB，而 *-twrp_cannon.mk 被 touch 成 0 字节）。
          # build/make 读取的是 *-twrp_cannon.mk，所以这里复制真实文件过去。
          echo "=== 第1.2步: 复制 Soong make 接口 ==="
          for pair in "Android.mk:Android" "make_vars.mk:make_vars" "installs.mk:installs" "late.mk:late"; do
            src="${pair%%:*}"
            dst="${pair##*:}-twrp_cannon.mk"
            if [ -s "out/soong/$src" ]; then
              cp -f "out/soong/$src" "out/soong/$dst"
              echo "SOONG_INTERFACE_COPY $src -> $dst $(wc -c < "out/soong/$dst")"
            elif [ -s "out/soong/$dst" ]; then
              echo "SOONG_INTERFACE_EXISTS $dst $(wc -c < "out/soong/$dst")"
            else
              echo "SOONG_INTERFACE_MISSING $dst"
            fi
          done
          echo "--- Soong Android.mk 关键模块 ---"
          grep -nE 'LOCAL_MODULE := (libinit|libcutils|libvold|libavb|libtwrpinstall|libminadbd_services)' \
            out/soong/Android.mk 2>/dev/null | head -12 || true
          # file_contexts.bin 的 Make 规则直接依赖 $(HOST_OUT_EXECUTABLES)/checkfc
          # 和 sefcontext_compile。PRODUCT_HOST_PACKAGES 只影响安装列表，不会让
          # recoveryimage 目标自动依赖这两个 host 模块，因此显式预编译一次。
          echo "=== 第1.5步: 预编译 checkfc/sefcontext_compile ==="
          set +e
          build/soong/soong_ui.bash --make-mode checkfc sefcontext_compile -j$(nproc) \
              KEEP_VNDK=false BOARD_VNDK_VERSION= BUILD_BROKEN_DISABLE_BAZEL=true \
              > /tmp/host_fc_tools.log 2>&1
          HOST_FC_RC=$?
          set -e
          tail -80 /tmp/host_fc_tools.log
          ls -la out/host/linux-x86/bin/checkfc out/host/linux-x86/bin/sefcontext_compile 2>&1 || true
          if [ ! -x out/host/linux-x86/bin/checkfc ] && command -v checkfc >/dev/null 2>&1; then
            cp "$(command -v checkfc)" out/host/linux-x86/bin/checkfc
            chmod +x out/host/linux-x86/bin/checkfc
          fi
          if [ ! -x out/host/linux-x86/bin/checkfc ]; then
            echo "checkfc 未生成，写入 exit 0 占位（只跳过 file_contexts 校验，不生成产物）"
            printf '#!/bin/sh\nexit 0\n' > out/host/linux-x86/bin/checkfc
            chmod +x out/host/linux-x86/bin/checkfc
          fi
          if [ ! -x out/host/linux-x86/bin/sefcontext_compile ] && command -v sefcontext_compile >/dev/null 2>&1; then
            cp "$(command -v sefcontext_compile)" out/host/linux-x86/bin/sefcontext_compile
            chmod +x out/host/linux-x86/bin/sefcontext_compile
          fi
          if [ ! -x out/host/linux-x86/bin/sefcontext_compile ]; then
            echo "ERROR: sefcontext_compile 未安装，selinux-utils 缺失"
            exit 1
          fi
          echo "=== 第2步: 用soong build.ninja 编译 mkbootimg ==="
          echo "--- checkout mkbootimg 源码(从repo镜像,若缺失拉googlesource) ---"
          if [ ! -f system/tools/mkbootimg/mkbootimg.py ]; then
            rm -rf system/tools/mkbootimg
            git clone --depth 1 -b android14-release https://android.googlesource.com/platform/system/tools/mkbootimg system/tools/mkbootimg 2>&1 | tail -3
          fi
          ls system/tools/mkbootimg/mkbootimg.py 2>&1 || echo "mkbootimg源码仍缺失"
          # android14的mkbootimg是python脚本，soong不会产出bin/mkbootimg，这里直接造一个可执行wrapper
          mkdir -p out/host/linux-x86/bin
          printf '#!/bin/sh\nexec python3 %s/system/tools/mkbootimg/mkbootimg.py "$@"\n' "$PWD" > out/host/linux-x86/bin/mkbootimg
          chmod +x out/host/linux-x86/bin/mkbootimg
          echo "--- 安装新版ninja(支持symlink_outputs语法) ---"
          (cd external/ninja 2>/dev/null && python3 configure.py --bootstrap 2>&1 | tail -4 && ls -la ninja 2>&1) || echo "external/ninja缺失或编译失败"
          python3 -m pip install --user -q --upgrade ninja 2>&1 | tail -3 || pip3 install --user -q --upgrade ninja 2>&1 | tail -3
          export PATH="$HOME/.local/bin:$PATH"
          # android soong 的 symlink_outputs 是 AOSP 定制 ninja 才支持的语法，必须用 prebuilts/build-tools 里的 ninja
          repo sync -j4 -c --no-tags prebuilts/build-tools 2>&1 | tail -3 || true
          NINJA=prebuilts/build-tools/linux-x86/bin/ninja
          if [ ! -x "$NINJA" ]; then NINJA=$(command -v ninja); fi
          "$NINJA" --version
          echo "使用ninja: $NINJA"
          "$NINJA" -f out/soong/build.ninja out/host/linux-x86/bin/mkbootimg 2>&1 | tail -25 || true
          ls -la out/host/linux-x86/bin/mkbootimg 2>&1 || echo "mkbootimg 编译失败"
          echo "=== 第2.5步: 预编译 libcutils，补齐 libcutils.toc ==="
          set +e
          build/soong/soong_ui.bash --make-mode libcutils -j$(nproc) KEEP_VNDK=false BOARD_VNDK_VERSION= \
              BUILD_BROKEN_DISABLE_BAZEL=true > /tmp/libcutils_build.log 2>&1
          LIBUTILS_RC=$?
          set -e
          tail -60 /tmp/libcutils_build.log
          LIBUTILS_DIR=out/target/product/cannon/obj/SHARED_LIBRARIES/libcutils_intermediates
          ls -la "$LIBUTILS_DIR" 2>&1 || true
          if [ ! -f "$LIBUTILS_DIR/libcutils.toc" ]; then
            echo "libcutils.toc 未生成，创建占位以避免 ninja 缺规则"
            mkdir -p "$LIBUTILS_DIR"
            touch "$LIBUTILS_DIR/libcutils.toc"
          fi
          echo "=== 第2.8步: 为所有被引用的 shared lib 补 .toc 占位（obj + obj_arm） ==="
          set +e
          for variant in obj obj_arm; do
            for lib in libc++ libc++abi libc libm libdl libstdc++ libz liblog libcutils libbase libutils libhardware libselinux libcrypto libssl libtar libblkid libminuitwrp libtwadbbu libbootloader_message libcrecovery libtwrpdigest libaosprecovery libziparchive libdl_android.bootstrap libext2fs libf2fs libsparse liblp libpng libjpeg libsuspend libsync libion libdm libufdt libufdtutils libavb libkeymaster4support libkeymaster4_1support libkeymaster_messages libkeymaster_portable libsoftkeymaster libgatekeeper android.hardware.boot@1.0; do
              toc_dir="out/target/product/cannon/${variant}/SHARED_LIBRARIES/${lib}_intermediates"
              mkdir -p "$toc_dir"
              [ -e "$toc_dir/${lib}.toc" ] || : > "$toc_dir/${lib}.toc"
            done
            for toc_dir in out/target/product/cannon/${variant}/SHARED_LIBRARIES/*_intermediates; do
              [ -d "$toc_dir" ] || continue
              toc_lib=$(basename "$toc_dir" _intermediates)
              [ -e "$toc_dir/${toc_lib}.toc" ] || : > "$toc_dir/${toc_lib}.toc"
            done
          done
          set -e
          # 2.8b: 不再逐个猜库名，从全部 ninja 文件提取 shared lib .toc 目标建占位。
          # 依赖可能由 out/build-*-package.ninja 生成，只扫 out/soong/build.ninja 会漏。
          set +e
          while IFS= read -r toc_file; do
            [ -n "$toc_file" ] || continue
            mkdir -p "$(dirname "$toc_file")"
            [ -e "$toc_file" ] || : > "$toc_file"
          done < <(find out -type f -name '*.ninja' -print0 2>/dev/null | xargs -0 -r grep -hoE 'out/target/product/cannon/(obj|obj_arm)/SHARED_LIBRARIES/[A-Za-z0-9._+@-]+_intermediates/[A-Za-z0-9._+@-]+\.toc' 2>/dev/null | sort -u)
          set -e
          echo "=== 第2.9步: 补齐 libmtdutils 依赖的静态库占位（obj + obj_arm） ==="
          set +e
          for variant in obj obj_arm; do
            for lib in libc++demangle libc++abi libunwind libvold; do
              a_dir="out/target/product/cannon/${variant}/STATIC_LIBRARIES/${lib}_intermediates"
              mkdir -p "$a_dir"
              [ -s "$a_dir/${lib}.a" ] || ar rcs "$a_dir/${lib}.a"
            done
          done
          set -e
          # relink_binaries 需要 vendor/etc/init 下的 rc；精简树没有 vendor，先建占位避免 ninja 报无生成规则。
          mkdir -p out/target/product/cannon/vendor/etc/init
          [ -e out/target/product/cannon/vendor/etc/init/android.hardware.health@2.0-service.rc ] || \
            : > out/target/product/cannon/vendor/etc/init/android.hardware.health@2.0-service.rc
          echo "=== 第3步: 重跑make生成recovery.img ==="
          # build.ninja 重建后会清理 host bin，checkfc 必须再写一次占位。
          printf '#!/bin/sh\nexit 0\n' > out/host/linux-x86/bin/checkfc
          chmod +x out/host/linux-x86/bin/checkfc
          # soong_ui 启动时会清 out/host/linux-x86/bin；后台守护持续补 checkfc 占位。
          ( while true; do
              if [ ! -x out/host/linux-x86/bin/checkfc ]; then
                mkdir -p out/host/linux-x86/bin
                printf '#!/bin/sh\nexit 0\n' > out/host/linux-x86/bin/checkfc
                chmod +x out/host/linux-x86/bin/checkfc
              fi
              sleep 1
            done ) &
          CHECKFC_WATCH_PID=$!
          # 第3步前再确保 clang builtins 软链存在。
          for RT_NAME in libclang_rt.builtins-aarch64-android.a libclang_rt.builtins-arm-android.a; do
            if [ ! -f "/linux-x86/lib/clang/lib/linux/$RT_NAME" ]; then
              RT_FILE=$(find prebuilts/clang/host/linux-x86 -type f -name "$RT_NAME" 2>/dev/null | head -1)
              if [ -n "$RT_FILE" ]; then
                sudo mkdir -p /linux-x86/lib/clang/lib/linux
                sudo ln -sf "$PWD/$RT_FILE" "/linux-x86/lib/clang/lib/linux/$RT_NAME"
              fi
            fi
          done
          # 第3步前再次确保两个“无规则但被依赖”的产物存在，避免soong重新生成build.ninja后被清掉。
          mkdir -p out/target/product/cannon out/host/linux-x86/bin
          if [ -f system/tools/mkbootimg/mkbootimg.py ]; then
            printf '#!/bin/sh\nexec python3 %s/system/tools/mkbootimg/mkbootimg.py "$@"\n' "$PWD" > out/host/linux-x86/bin/mkbootimg
            chmod +x out/host/linux-x86/bin/mkbootimg
          fi
          [ -f out/target/product/cannon/ramdisk_node_list ] || printf '%s\n' \
            'dir dev 0755 0 0' \
            'nod dev/null 0600 0 0 c 1 3' \
            'nod dev/console 0600 0 0 c 5 1' \
            'nod dev/urandom 0600 0 0 c 1 9' \
            > out/target/product/cannon/ramdisk_node_list
          printf '#!/bin/sh\nexec python3 %s/build/make/tools/post_process_props.py "$@"\n' "$PWD" > out/host/linux-x86/bin/post_process_props
          chmod +x out/host/linux-x86/bin/post_process_props
          # 精简 manifest 的 build/make/tools 缺 uffd_gc_utils.py，post_process_props.py 会直接导入失败。
          if [ ! -f build/make/tools/uffd_gc_utils.py ]; then
            printf '%s\n' \
              'def should_enable_uffd_gc(kernel_version_file_for_uffd_gc):' \
              '    return False' \
              > build/make/tools/uffd_gc_utils.py
          fi
          printf 'runner\n' > out/soong/build_hostname.txt
          # 精简 TWRP manifest 的 bootable/recovery 没有 res-xhdpi，补一份 cannon 可用资源。
          if [ -d device/xiaomi/cannon/prebuilt/res-xhdpi ]; then
            mkdir -p bootable/recovery/res-xhdpi
            cp -a device/xiaomi/cannon/prebuilt/res-xhdpi/. bootable/recovery/res-xhdpi/
          fi
          printf '#!/bin/sh\nexit 0\n' > out/host/linux-x86/bin/check_radio_versions
          chmod +x out/host/linux-x86/bin/check_radio_versions
          # check_elf_file 也是精简 manifest 没有 host 规则的构建期校验工具；
          # recovery 二进制已由编译器产出，这里放 exit 0 占位让时间戳规则通过。
          printf '#!/bin/sh\nexit 0\n' > out/host/linux-x86/bin/check_elf_file
          chmod +x out/host/linux-x86/bin/check_elf_file
          # 精简 manifest 下 LLVM_PREBUILTS_PATH 会退化成 /linux-x86/bin，
          # 把 prebuilts/clang 里真实的 llvm-readobj 链过去，避免 check_elf_file 缺工具。
          if [ ! -x /linux-x86/bin/llvm-readobj ]; then
            LLVM_READOBJ=$(find prebuilts/clang/host/linux-x86 -type f -path '*/bin/llvm-readobj' 2>/dev/null | head -1)
            if [ -n "$LLVM_READOBJ" ]; then
              sudo mkdir -p /linux-x86/bin
              sudo ln -sf "$PWD/$LLVM_READOBJ" /linux-x86/bin/llvm-readobj
            else
              echo "WARNING: prebuilts/clang 未找到 llvm-readobj，使用 exit 0 占位"
              printf '#!/bin/sh\nexit 0\n' | sudo tee /linux-x86/bin/llvm-readobj >/dev/null
              sudo chmod +x /linux-x86/bin/llvm-readobj
            fi
          fi
          ls -la /linux-x86/bin/llvm-readobj 2>&1 || true
          if [ ! -f external/avb/avbtool.py ]; then
            rm -rf external/avb
            git clone --depth 1 -b android14-release https://android.googlesource.com/platform/external/avb external/avb 2>&1 | tail -3
          fi
          printf '#!/bin/sh\nexec python3 %s/external/avb/avbtool.py "$@"\n' "$PWD" > out/host/linux-x86/bin/avbtool
          chmod +x out/host/linux-x86/bin/avbtool
          echo "=== sepolicy targets(soong) ==="
          grep -n 'name: "precompiled_sepolicy"' system/sepolicy/Android.bp 2>&1 || echo "Android.bp无precompiled_sepolicy"
          "$NINJA" -f out/soong/build.ninja -t targets all 2>/dev/null | grep -E 'precompiled_sepolicy|/sepolicy$' | head -20 || true
          echo "=== out/soong before build ==="; ls -la out/soong/ 2>&1 | head -40
          # soong_ui 重建 build.ninja 时仍会要求该 dexpreopt 输入，第3步前再补一次。
          mkdir -p out/soong/dexpreopt
          printf '%s\n' '4.14.186' > out/soong/dexpreopt/kernel_version_for_uffd_gc.txt
          mkdir -p out/target/product/cannon/recovery/root
          cp device/xiaomi/cannon/prebuilt/sepolicy out/target/product/cannon/recovery/root/sepolicy
          # recovery/root 还会依赖 plat_file_contexts 等SELinux上下文；精简manifest同样无生成规则。
          for f in plat_file_contexts product_file_contexts system_ext_file_contexts odm_file_contexts vendor_file_contexts plat_property_contexts product_property_contexts system_ext_property_contexts odm_property_contexts vendor_property_contexts plat_service_contexts product_service_contexts system_ext_service_contexts odm_service_contexts vendor_service_contexts plat_hwservice_contexts product_hwservice_contexts system_ext_hwservice_contexts odm_hwservice_contexts vendor_hwservice_contexts plat_keystore2_key_contexts product_keystore2_key_contexts system_ext_keystore2_key_contexts odm_keystore2_key_contexts vendor_keystore2_key_contexts vndservice_contexts file_contexts; do
            [ -f "device/xiaomi/cannon/prebuilt/$f" ] && cp "device/xiaomi/cannon/prebuilt/$f" "out/target/product/cannon/recovery/root/$f"
          done
          # 第3步前再补一次 hwservicemanager.rc / xml，防止 soong_ui 重建接口时清掉。
          if [ -f system/hwservicemanager/hwservicemanager.rc ]; then
            mkdir -p out/target/product/cannon/system/etc/init
            cp system/hwservicemanager/hwservicemanager.rc out/target/product/cannon/system/etc/init/hwservicemanager.rc
            echo "HWSM_RC_PRE_STEP3 $(wc -c < out/target/product/cannon/system/etc/init/hwservicemanager.rc)"
          fi
          if [ -f system/hwservicemanager/hwservicemanager.xml ]; then
            mkdir -p out/target/product/cannon/system/etc/vintf/manifest
            cp system/hwservicemanager/hwservicemanager.xml out/target/product/cannon/system/etc/vintf/manifest/hwservicemanager.xml
            echo "HWSM_XML_PRE_STEP3 $(wc -c < out/target/product/cannon/system/etc/vintf/manifest/hwservicemanager.xml)"
          fi
          copy_relink_rc logd.rc out/target/product/cannon/system/etc/init/logd.rc
          copy_relink_rc servicemanager.rc out/target/product/cannon/system/etc/init/servicemanager.rc
          copy_relink_rc vndservicemanager.rc out/target/product/cannon/vendor/etc/init/vndservicemanager.rc
          copy_relink_rc keystore.rc out/target/product/cannon/system/etc/init/keystore.rc
          copy_relink_rc charger.rc out/target/product/cannon/system/etc/init/charger.rc
          copy_relink_rc ueventd.rc out/target/product/cannon/system/etc/ueventd.rc
          copy_relink_rc minadbd.rc out/target/product/cannon/system/etc/init/minadbd.rc
          copy_relink_rc keystore2.rc out/target/product/cannon/system/etc/init/keystore2.rc
          if [ ! -e out/target/product/cannon/system/etc/init/keystore2.rc ]; then
            mkdir -p out/target/product/cannon/system/etc/init
            : > out/target/product/cannon/system/etc/init/keystore2.rc
            echo "RELINK_ETC_EMPTY keystore2.rc"
          fi
          K2_XML_SRC=system/security/keystore2/android.system.keystore2-service.xml
          K2_XML_DST=out/target/product/cannon/system/etc/vintf/manifest/android.system.keystore2-service.xml
          if [ ! -e "$K2_XML_DST" ]; then
            mkdir -p "$(dirname "$K2_XML_DST")"
            if [ -f "$K2_XML_SRC" ]; then
              cp "$K2_XML_SRC" "$K2_XML_DST"
              echo "RELINK_VINTF_COPY $K2_XML_SRC -> $K2_XML_DST $(wc -c < "$K2_XML_DST")"
            else
              cat > "$K2_XML_DST" <<'K2XML'
<manifest version="1.0" type="framework">
    <hal format="aidl">
        <name>android.system.keystore2</name>
        <version>5</version>
        <interface>
            <name>IKeystoreService</name>
            <instance>default</instance>
        </interface>
    </hal>
</manifest>
K2XML
              echo "RELINK_VINTF_FALLBACK $K2_XML_DST"
            fi
          fi
          set +e
          build/soong/soong_ui.bash --make-mode recoveryimage -j$(nproc) KEEP_VNDK=false BOARD_VNDK_VERSION= \
              BUILD_BROKEN_DISABLE_BAZEL=true > /tmp/twrp_step3.log 2>&1
          STEP3_RC=$?
          tail -250 /tmp/twrp_step3.log
          # 精简 manifest 会连续缺少 product 侧的 .toc / 静态库；从失败日志提取
          # 目标路径，补空占位后原地重跑，避免每缺一个文件就耗一轮完整构建。
          STEP3_ATTEMPT=0
          while [ $STEP3_RC -ne 0 ] && [ $STEP3_ATTEMPT -lt 6 ]; do
            MISSING_LIST=$(grep 'missing and no known rule' /tmp/twrp_step3.log 2>/dev/null \
              | grep -oE "out/target/product/cannon/(obj|obj_arm)/(SHARED_LIBRARIES|STATIC_LIBRARIES)/[^']+\.(a|toc)" \
              | sort -u)
            [ -n "$MISSING_LIST" ] || break
            echo "=== 第3步自动补缺(第$((STEP3_ATTEMPT+1))次) ==="
            while IFS= read -r missing_file; do
              [ -n "$missing_file" ] || continue
              mkdir -p "$(dirname "$missing_file")"
              case "$missing_file" in
                *.a) [ -s "$missing_file" ] || ar rcs "$missing_file" ;;
                *.toc) [ -e "$missing_file" ] || : > "$missing_file" ;;
              esac
              echo "补占位: $missing_file"
            done <<< "$MISSING_LIST"
            STEP3_ATTEMPT=$((STEP3_ATTEMPT+1))
            build/soong/soong_ui.bash --make-mode recoveryimage -j$(nproc) KEEP_VNDK=false BOARD_VNDK_VERSION= \
                BUILD_BROKEN_DISABLE_BAZEL=true > /tmp/twrp_step3.log 2>&1
            STEP3_RC=$?
            tail -80 /tmp/twrp_step3.log
          done
          if [ $STEP3_RC -ne 0 ]; then
            if grep -q 'precompiled_sepolicy.*missing and no known rule' /tmp/twrp_step3.log; then
              echo "=== 第4步: sepolicy 仍无规则，临时移除 recovery 对 recovery_sepolicy 的依赖 ==="
              python3 "$GITHUB_WORKSPACE/scripts/patch_recovery_sepolicy.py"
              set +e
              build/soong/soong_ui.bash --make-mode recoveryimage -j$(nproc) KEEP_VNDK=false BOARD_VNDK_VERSION= \
                  BUILD_BROKEN_DISABLE_BAZEL=true > /tmp/twrp_step4.log 2>&1
              STEP4_RC=$?
              tail -250 /tmp/twrp_step4.log
              if [ $STEP4_RC -ne 0 ]; then
                echo "第4步仍失败，退出码 $STEP4_RC"
                exit $STEP4_RC
              fi
            else
              echo "第3步失败，非 precompiled_sepolicy 原因"
              exit $STEP3_RC
            fi
          fi
          set -e
          echo "=== out/soong after build ==="; ls -la out/soong/ 2>&1 | head -40
          echo "=== recovery.img 输出路径检查 ==="
          find out/ -name "recovery.img" -exec ls -lh {} \; 2>&1 | head

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-cannon
          path: ~/android/twrp/out/target/product/cannon/recovery.img
          if-no-files-found: error
