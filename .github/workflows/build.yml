name: Build TWRP for cannon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEVICE: cannong
  DEVICE_PATH: device/xiaomi/cannong
  TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  TWRP_BRANCH: twrp-14

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip repo
          pip3 install networkx
          # 编译rbcrun(starlark工具链)需要Go，apt默认go1.18太旧，装官方go1.22
          wget -q https://go.dev/dl/go1.22.5.linux-amd64.tar.gz -O /tmp/go.tar.gz && \
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz && \
          echo "/usr/local/go/bin" >> $GITHUB_PATH && \
          go version

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Initialize TWRP manifest
        run: |
          mkdir -p ~/android/twrp
          cd ~/android/twrp
          repo init -u $TWRP_MANIFEST -b $TWRP_BRANCH
          # 关键修复：twrp-14 manifest缺少build/release仓库，导致release config为空
          # 同步pdk组(TWRP recovery编译必需)，-c浅克隆当前分支减磁盘占用
          # 设备树(cannong)和build/release单独处理
          # 同步pdk组(AOSP基础)
          repo sync -j$(nproc) --force-sync -c --no-tags -g pdk,tradefed 2>&1 | tail -15
          # 显式同步TWRP核心仓库(vendor/twrp等不在pdk组，但编译必需)
          repo sync -j$(nproc) -c --no-tags             vendor/twrp bootable/recovery system/core system/vold system/security             system/libhidl system/update_engine system/extras external/icu             external/libxml2 external/sqlite external/python3 external/lptools             external/bash external/libncurses external/nano external/ntfs-3g             hardware/interfaces prebuilts/tools-lineage toolchain/pgo-profiles 2>&1 | tail -10
          # envsetup.sh:2117需要vendor/twrp/build/envsetup.sh(TeamWin的android_vendor_twrp仓库)
          # twrp-14 manifest不含此项目，从GitHub TeamWin仓库android-14分支clone
          [ -f vendor/twrp/build/envsetup.sh ] || \
            { rm -rf vendor/twrp && git clone -q --depth 1 -b android-14 https://github.com/TeamWin/android_vendor_twrp.git vendor/twrp 2>&1 | tail -3; }
          ls vendor/twrp/build/envsetup.sh 2>&1
          # soong_config.mk需要toolchain/pgo-profiles/sampling/afdo_profiles.mk(Android 14新增)
          # TWRP manifest可能不含此仓库，repo sync失败则从清华源git clone兜底
          repo sync -j$(nproc) -c --no-tags toolchain/pgo-profiles 2>&1 | tail -3 || true
          [ -f toolchain/pgo-profiles/sampling/afdo_profiles.mk ] || \
            (git clone -q --depth 1 https://android.googlesource.com/toolchain/pgo-profiles toolchain/pgo-profiles 2>&1 | tail -3) || \
            (git clone -q --depth 1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/toolchain/pgo-profiles.git toolchain/pgo-profiles 2>&1 | tail -3)
          ls toolchain/pgo-profiles/sampling/afdo_profiles.mk 2>&1
          # 关键：TWRP用TeamWin的build/make和build/soong(android-14分支)
          # 它们覆盖AOSP版本，必须显式重新同步确保soong_ui.bash存在
          repo sync -j$(nproc) -c --no-tags build/make build/soong 2>&1 | tail -8
          ls -la build/soong/soong_ui.bash 2>&1 || echo "SOONG_UI_MISSING"
          # 同步TWRP recovery必需的device/generic(通用设备支持)
          repo sync -j$(nproc) -c --no-tags device/generic 2>&1 | tail -5 || true
          # 检查磁盘占用
          du -sh ~/android/twrp 2>/dev/null || true
          df -h / 
          # 手动克隆build/release（manifest不含此project，repo sync找不到）
          # 必须用android14分支(android14-qpr2-release)，其release_config_map.mk设置
          # FLAG_DECLARATION_FILES:=build_flags.scl并声明ap1a(Android 14 make格式release)
          # main分支是proto格式(textproto flags)且用ap2a(Android 15)，与TWRP不配套
          git clone --depth 1 -b android14-qpr2-release https://android.googlesource.com/platform/build/release build/release 2>&1 | tail -5 || \
          git clone --depth 1 -b android14-qpr2-release https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/build/release.git build/release 2>&1 | tail -5 || \
          git clone --depth 1 -b android14-qpr2-release https://github.com/aosp-mirror/platform_build_release build/release 2>&1 | tail -5
          # 确认android14分支结构正确
          echo "=== release_config_map.mk ==="
          cat build/release/release_config_map.mk 2>&1 | head -30
          echo "=== ap1a.scl / build_flags.scl ==="
          ls build/release/build_config/ap1a.scl build/release/build_flags.scl 2>&1
          # 清理synced但不用的仓库释放空间
          sudo rm -rf cts art dalvik developers development
          # 关键：Android 14 release机制需要rbcrun(starlark工具链)
          # rbcrun是Go程序，依赖external/starlark-go(go.mod replace ../../../../external/starlark-go)
          # manifest其实包含此project(目录已存在)，只是未在pdk组，优先repo sync拉取AOSP官方版本
          repo sync -j$(nproc) --force-sync -c --no-tags external/starlark-go 2>&1 | tail -8
          # 强制使用AOSP官方starlark-go：Android.bp必须含go-starlark-starlarkjson模块供soong解析
          # repo sync/googlesource拉的可能是185字节占位Android.bp(无starlarkjson)，需验证并换清华源
          if ! grep -q "go-starlark-starlarkjson" external/starlark-go/Android.bp 2>/dev/null; then
            echo "starlarkjson missing in Android.bp, cloning from TUNA..."
            rm -rf external/starlark-go
            git clone --depth 1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/external/starlark-go.git external/starlark-go 2>&1 | tail -3 || \
            git clone --depth 1 https://android.googlesource.com/platform/external/starlark-go external/starlark-go 2>&1 | tail -3
          fi
          grep -n "go-starlark-starlarkjson" external/starlark-go/Android.bp 2>&1 || echo "STARLARKJSON_MISSING"
          # release_config.scl依赖//build/bazel/utils:schema_validation.scl
          # TWRP精简同步可能缺该文件，先从AOSP源下载，失败则创建最小实现(只需validate函数)
          mkdir -p build/bazel/utils
          curl -s "https://android.googlesource.com/platform/build/bazel/+/refs/heads/main/utils/schema_validation.scl?format=TEXT" | base64 -d > build/bazel/utils/schema_validation.scl 2>/dev/null || true
          if ! grep -q "def validate" build/bazel/utils/schema_validation.scl 2>/dev/null; then
            echo "creating minimal schema_validation.scl"
            printf 'def validate(data, schema):\n    return None\n' > build/bazel/utils/schema_validation.scl
          fi
          ls -la build/bazel/utils/schema_validation.scl && head -5 build/bazel/utils/schema_validation.scl
          df -h / 
          echo "SYNC_DONE" 

      - name: Copy device tree
        run: |
          cp -r $GITHUB_WORKSPACE/device ~/android/twrp/
          ls -la ~/android/twrp/device/xiaomi/cannong/
          # 删除设备树里的release_config_map.mk，避免与build/release的android14分支map冲突(ap1a)
          rm -f ~/android/twrp/device/xiaomi/cannong/release/release_config_map.mk

      - name: Build TWRP
        run: |
          cd ~/android/twrp
          # Android 14 release机制要求rbcrun存在于out/rbcrun
          # 用Go直接编译rbcrun(避免完整soong构建)，供release_config.mk调用
          cd build/make/tools/rbcrun && GOFLAGS=-mod=mod go build -o ~/android/twrp/out/rbcrun ./rbcrun 2>&1 | tail -20
          ls -la ~/android/twrp/out/rbcrun 2>&1 || echo "RBCRUN_MISSING"
          cd ~/android/twrp
          . ./build/envsetup.sh
          # metadata工具依赖soong-testing proto模块(TeamWin build/soong不含)，recovery不需要它。
          # teams/Android.bp用AOSP新"team"模块类型(soong不认识)，recovery也不需要。
          # build/release/aconfig和build/make/target/product/gsi的Android.bp用aconfig_value_set/install_symlink
          # 等AOSP新类型(TeamWin soong不识别)，recovery都不需要，一并删除避免报错
          rm -rf build/make/tools/metadata build/make/teams build/release/aconfig build/make/target/product/gsi build/make/tools/aconfig
          # TWRP recovery不需要媒体/AppSearch/蓝牙/网络等AOSP服务模块。
          # 删除避免soong生成ninja时暴露模块可见性/api tracking等错误
          rm -rf packages/modules/Media packages/modules/AppSearch packages/modules/Bluetooth \
                packages/modules/Wifi packages/modules/CellBroadcast packages/modules/Connectivity \
                packages/modules/NetworkStack packages/modules/Telephony packages/modules/Permission \
                packages/modules/StatsD packages/modules/Release packages/modules/Scheduling \
                packages/modules/Uwb packages/modules/HealthFitness packages/modules/DnsResolver \
                packages/modules/Nfc packages/modules/TimeZoneData packages/modules/RuntimeI18n \
                packages/modules/RemoteKeyProvisioning packages/modules/Virtualization
          # frameworks/av/apex定义Media apex，引用已删的packages/modules/Media模块；apexd_testdata是测试数据。
          # recovery不依赖这些，删除避免soong报错
          rm -rf frameworks/av/apex system/apex/apexd/apexd_testdata
          # system/apex/tests是apex测试数据(recovery不需要)，其testdata引用build id导致soong报错
          rm -rf system/apex/tests
          # system/apex/apexd(apex daemon)recovery不需要，其测试模块引用已删的apexd_testdata报错
          rm -rf system/apex/apexd
          # packages/modules/IPsec的apex(updatable APEX需min_sdk_version)recovery不需要
          rm -rf packages/modules/IPsec
          # 批量删除所有updatable apex定义(recovery不需要，逐个删太慢)。
          # soong会为updatable apex校验min_sdk_version，TWRP recovery全是C++不依赖任何apex
          find external frameworks packages -type d -name apex -exec rm -rf {} + 2>/dev/null || true
          # soong_ui的defaultBazelProdMode默认返回true导致--bazel-mode开启。
          # 只有BUILD_BROKEN_DISABLE_BAZEL=true能强制禁用(config.go:IsBazelMixedBuildForceDisabled)，
          # USE_BAZEL_ANALYSIS/TARGET_BUILD_UNBUNDLED/make命令行都不生效。TWRP用纯make，禁用bazel
          export BUILD_BROKEN_DISABLE_BAZEL=true
          export USE_BAZEL_ANALYSIS=false
          export ALLOW_MISSING_DEPENDENCIES=true
          # TWRP的soong(android-14)未注册PATH_OVERRIDE_SOONG/KERNEL_*等TWRP自定义变量，
          # 且移植场景不设kernel编译变量，soong解析cmd时报unknown variable。
          # patch移除这些变量引用(保留soong内置genDir)。recovery不需要kernel headers_install
          python3 $GITHUB_WORKSPACE/scripts/patch_twrp_bp.py
          # TWRP recovery不编译vendor，无需VNDK。lunch触发的make也需读到KEEP_VNDK=false
          # envsetup.mk用?=设KEEP_VNDK，先export则?=不覆盖。避免board_config检查VNDK 34 prebuilt
          export KEEP_VNDK=false
          export BOARD_VNDK_VERSION=
          # TWRP是recovery构建，TARGET_BUILD_UNBUNDLED=true触发bazel混合构建导致cquery缺依赖。
          # 用KEEP_VNDK=false即可跳过VNDK检查，TARGET_BUILD_UNBUNDLED改false
          export TARGET_BUILD_UNBUNDLED=false
          export OVERRIDE_PRODUCT_EXTRA_VNDK_VERSIONS=
          export PRODUCT_EXTRA_VNDK_VERSIONS=
          # Android 14正确编译方案：ap1a是Android 14的make格式release名
          export TARGET_RELEASE=ap1a
          # 手动预生成release config .mk，避免make的KATI_shell_no_rerun跳过rbcrun导致.mk缺失
          # 精确复制release_config.mk的entrypoint生成逻辑(load build_flags.scl + ap1a.scl)
          mkdir -p out/starlark_results
          printf '%s\n' \
            'load("//build/make/core/release_config.scl", "release_config")' \
            'def add(d, k, v):' \
            '    d = dict(d)' \
            '    d[k] = v' \
            '    return d' \
            'load("build/release/build_flags.scl", flags_build_release_build_flags_scl = "flags")' \
            'all_flags = [] + [add(x, "declared_in", "build/release/build_flags.scl") for x in flags_build_release_build_flags_scl]' \
            'load("//build/release/build_config/ap1a.scl", values_build_release_build_config_ap1a_scl = "values")' \
            'all_values = [] + [add(x, "set_in", "build/release/build_config/ap1a.scl") for x in values_build_release_build_config_ap1a_scl]' \
            'variables_to_export_to_make = release_config(all_flags, all_values)' \
            > out/release_config_entrypoint.scl
          ./out/rbcrun --mode=make --allow_external_entrypoint out/release_config_entrypoint.scl > out/starlark_results/out_release_config_entrypoint.scl.mk 2>out/rbcrun3.err
          echo "PRE_EXIT=$?"
          echo "=== rbcrun3 stderr ==="; head -30 out/rbcrun3.err 2>&1
          echo "=== 预生成 .mk ==="; cat out/starlark_results/out_release_config_entrypoint.scl.mk 2>&1 | head -40
          build_build_var_cache
          # 关键:lunch必须在当前shell直接运行(不能接管道|tail,否则在子shell执行,TARGET_PRODUCT等
          # 环境变量设置会丢失,soong_ui默认aosp_arm导致cleanspec找make_vars-aosp_arm.mk缺失)
          lunch twrp_cannong-ap1a-eng >/dev/null 2>&1
          echo "TARGET_PRODUCT=$TARGET_PRODUCT TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          # TWRP recovery不编译vendor，无需VNDK。make命令行强制KEEP_VNDK=false+BOARD_VNDK_VERSION空
          # 命令行优先级最高，覆盖makefile里的设置，避免board_config检查VNDK 34 prebuilt
          # pipefail防止make失败被tail吞掉退出码导致误报success；再显式校验recovery.img生成
          set -o pipefail
          # 命令行也传BUILD_BROKEN_DISABLE_BAZEL=true禁用bazel混合构建(双重保险)
          # make_vars-<product>.mk不由soong_build写(只有build.ninja/Android.mk/installs由soong生成)，
          # cleanspec(cleanbuild.mk include SOONG_MAKEVARS_MK)需要它存在。touch空文件保底：
          # soong会为当前产品(twrp_cannong)生成真实Android.mk+installs，cleanspec用空make_vars只做清理检查(不清理全新out)
          mkdir -p out/soong && touch out/soong/make_vars-twrp_cannong.mk
          echo "=== out/soong before build ==="; ls -la out/soong/ 2>&1 | head -40
          build/soong/soong_ui.bash --make-mode recoveryimage -j$(nproc) KEEP_VNDK=false BOARD_VNDK_VERSION= \
              BUILD_BROKEN_DISABLE_BAZEL=true 2>&1 | tail -250
          echo "=== out/soong after build ==="; ls -la out/soong/ 2>&1 | head -40
          echo "=== recovery.img 输出路径检查 ==="
          find out/ -name "recovery.img" -exec ls -lh {} \; 2>&1 | head

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-cannon
          path: ~/android/twrp/out/target/product/cannong/recovery.img
