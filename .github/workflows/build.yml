name: Build TWRP for cannon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEVICE: cannong
  DEVICE_PATH: device/xiaomi/cannong
  TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  TWRP_BRANCH: twrp-14

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip repo
          pip3 install networkx

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Initialize TWRP manifest
        run: |
          mkdir -p ~/android/twrp
          cd ~/android/twrp
          repo init -u $TWRP_MANIFEST -b $TWRP_BRANCH
          # 关键修复：twrp-14 manifest缺少build/release仓库，导致release config为空、ap3a无法识别
          # 先同步全部仓库
          repo sync -j$(nproc) --force-sync -c --no-tags 2>&1 | tail -20
          # 检查磁盘占用
          du -sh ~/android/twrp 2>/dev/null || true
          df -h / 
          # 手动克隆build/release（manifest不含此project，repo sync找不到）
          # AOSP官方源，runner在海外访问快
          git clone --depth 1 https://android.googlesource.com/platform/build/release build/release 2>&1 | tail -5 || \
          git clone --depth 1 https://github.com/aosp-mirror/platform_build_release build/release 2>&1 | tail -5 || \
          git clone --depth 1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/build/release.git build/release 2>&1 | tail -5
          # 确认ap3a (Android 14) release config存在
          ls build/release/release_configs/ap3a.textproto 2>&1 || echo "AP3A_MISSING"
          echo "SYNC_DONE" 

      - name: Copy device tree
        run: |
          cp -r $GITHUB_WORKSPACE/device ~/android/twrp/
          ls -la ~/android/twrp/device/xiaomi/cannong/

      - name: Build TWRP
        run: |
          cd ~/android/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          # 设备树声明了 'next' release (build/release/build_config/ap2a.scl)
          lunch twrp_cannong-next-eng 2>&1 || lunch twrp_cannong-eng
          make recoveryimage -j$(nproc) 2>&1 | tail -200

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-cannon
          path: ~/android/twrp/out/target/product/cannong/recovery.img
