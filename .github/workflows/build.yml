name: Build TWRP for cannon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEVICE: cannong
  DEVICE_PATH: device/xiaomi/cannong
  TWRP_MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  TWRP_BRANCH: twrp-14

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip repo
          pip3 install networkx
          # 编译rbcrun(starlark工具链)需要Go，apt默认go1.18太旧，装官方go1.22
          wget -q https://go.dev/dl/go1.22.5.linux-amd64.tar.gz -O /tmp/go.tar.gz && \
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz && \
          echo "/usr/local/go/bin" >> $GITHUB_PATH && \
          go version

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/lib/google-cloud-sdk
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Initialize TWRP manifest
        run: |
          mkdir -p ~/android/twrp
          cd ~/android/twrp
          repo init -u $TWRP_MANIFEST -b $TWRP_BRANCH
          # 关键修复：twrp-14 manifest缺少build/release仓库，导致release config为空
          # 同步pdk组(TWRP recovery编译必需)，-c浅克隆当前分支减磁盘占用
          # 设备树(cannong)和build/release单独处理
          # 同步pdk组(AOSP基础)
          repo sync -j$(nproc) --force-sync -c --no-tags -g pdk,tradefed 2>&1 | tail -15
          # 显式同步TWRP核心仓库(vendor/twrp等不在pdk组，但编译必需)
          repo sync -j$(nproc) -c --no-tags             vendor/twrp bootable/recovery system/core system/vold system/security             system/libhidl system/update_engine system/extras external/icu             external/libxml2 external/sqlite external/python3 external/lptools             external/bash external/libncurses external/nano external/ntfs-3g             hardware/interfaces prebuilts/tools-lineage 2>&1 | tail -10
          # 关键：TWRP用TeamWin的build/make和build/soong(android-14分支)
          # 它们覆盖AOSP版本，必须显式重新同步确保soong_ui.bash存在
          repo sync -j$(nproc) -c --no-tags build/make build/soong 2>&1 | tail -8
          ls -la build/soong/soong_ui.bash 2>&1 || echo "SOONG_UI_MISSING"
          # 同步TWRP recovery必需的device/generic(通用设备支持)
          repo sync -j$(nproc) -c --no-tags device/generic 2>&1 | tail -5 || true
          # 检查磁盘占用
          du -sh ~/android/twrp 2>/dev/null || true
          df -h / 
          # 手动克隆build/release（manifest不含此project，repo sync找不到）
          # AOSP官方源，runner在海外访问快
          git clone --depth 1 https://android.googlesource.com/platform/build/release build/release 2>&1 | tail -5 || \
          git clone --depth 1 https://github.com/aosp-mirror/platform_build_release build/release 2>&1 | tail -5 || \
          git clone --depth 1 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/build/release.git build/release 2>&1 | tail -5
          # 确认release config存在(ap2a=Android 14 make格式release)
          ls build/release/build_config/ap2a.scl 2>&1 || echo "AP2A_SLC_MISSING"
          ls build/release/release_configs/ 2>&1 || echo "RELEASE_CONFIGS_MISSING"
          # 清理synced但不用的仓库释放空间
          sudo rm -rf cts art dalvik developers development
          # 关键：Android 14 release机制需要rbcrun(starlark工具链)
          # rbcrun是Go程序，依赖external/starlark-go(go.mod replace ../../../../external/starlark-go)
          # manifest其实包含此project(目录已存在)，只是未在pdk组，优先repo sync拉取AOSP官方版本
          repo sync -j$(nproc) --force-sync -c --no-tags external/starlark-go 2>&1 | tail -8
          if [ ! -f external/starlark-go/go.mod ]; then
            echo "repo sync failed, trying git clone AOSP source..."
            git clone --depth 1 https://android.googlesource.com/platform/external/starlark-go external/starlark-go 2>&1 | tail -3 || true
          fi
          ls external/starlark-go/go.mod 2>&1 || echo "STARLARK_GO_MISSING"
          # release_config.scl依赖//build/bazel/utils:schema_validation.scl
          # TWRP精简同步可能缺该文件，先从AOSP源下载，失败则创建最小实现(只需validate函数)
          mkdir -p build/bazel/utils
          curl -s "https://android.googlesource.com/platform/build/bazel/+/refs/heads/main/utils/schema_validation.scl?format=TEXT" | base64 -d > build/bazel/utils/schema_validation.scl 2>/dev/null || true
          if ! grep -q "def validate" build/bazel/utils/schema_validation.scl 2>/dev/null; then
            echo "creating minimal schema_validation.scl"
            printf 'def validate(data, schema):\n    return None\n' > build/bazel/utils/schema_validation.scl
          fi
          ls -la build/bazel/utils/schema_validation.scl && head -5 build/bazel/utils/schema_validation.scl
          df -h / 
          echo "SYNC_DONE" 

      - name: Copy device tree
        run: |
          cp -r $GITHUB_WORKSPACE/device ~/android/twrp/
          ls -la ~/android/twrp/device/xiaomi/cannong/

      - name: Build TWRP
        run: |
          cd ~/android/twrp
          # Android 14 release机制要求rbcrun存在于out/rbcrun
          # 用Go直接编译rbcrun(避免完整soong构建)，供release_config.mk调用
          cd build/make/tools/rbcrun && GOFLAGS=-mod=mod go build -o ~/android/twrp/out/rbcrun ./rbcrun 2>&1 | tail -20
          ls -la ~/android/twrp/out/rbcrun 2>&1 || echo "RBCRUN_MISSING"
          # 验证rbcrun能解析ap2a.scl(即schema_validation.scl已就位)
          cd ~/android/twrp && ./out/rbcrun --mode=make --allow_external_entrypoint build/release/build_config/ap2a.scl 2>&1 | head -10 || echo "RBCRUN_RUN_FAIL"
          # 模拟release_config.mk生成的entrypoint(load release_config.scl并调用release_config)
          cd ~/android/twrp && mkdir -p out/starlark_results && \
          printf 'load("//build/make/core/release_config.scl", "release_config")\ndef add(d, k, v):\n    d = dict(d)\n    d[k] = v\n    return d\nall_flags = []\nall_values = []\nvariables_to_export_to_make = release_config(all_flags, all_values)\n' > out/release_config_entrypoint.scl && \
          ./out/rbcrun --mode=make --allow_external_entrypoint out/release_config_entrypoint.scl 2>&1 | head -15 || echo "ENTRYPOINT_RUN_FAIL"
          cd ~/android/twrp
          . ./build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          # Android 14正确编译方案：ap2a是Android 14的release名
          # 先设置TARGET_RELEASE并重建build var缓存
          export TARGET_RELEASE=ap2a
          build_build_var_cache
          lunch twrp_cannong-ap2a-eng
          make recoveryimage -j$(nproc) 2>&1 | tail -200

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-cannon
          path: ~/android/twrp/out/target/product/cannong/recovery.img
